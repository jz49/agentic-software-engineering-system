# Local development database only. Integration tests do not use this file —
# they start their own Postgres through Testcontainers (ADR-004), and production
# takes its datasource from the environment. The credentials below are therefore
# dev-only and are mirrored by application-dev.yml.
services:
  postgres:
    image: postgres:17-alpine
    container_name: url-shortener-postgres
    environment:
      POSTGRES_DB: urlshortener
      POSTGRES_USER: urlshortener
      POSTGRES_PASSWORD: urlshortener
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U urlshortener -d urlshortener"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
